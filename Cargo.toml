[package]
name = "tokenharbor-bot"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Account, key and model client for the Token Harbor gateway"

[[bin]]
name = "tokenharbor-bot"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4"
ed25519-dalek = "2"
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
